<style>

 padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 40px max(18px,env(safe-area-inset-left))}
/* depth layers: aurora orbs (parallax) + vignette + film grain */

.o2{width:380px;height:380px;right:-130px;top:120px;background:radial-gradient(circle,rgba(150,225,255,.6),transparent 68%);transform:translate(calc(var(--px)*-34px),calc(var(--py)*-22px));animation:dr2 17s ease-in-out infinite alternate}
.o3{width:460px;height:340px;left:10%;bottom:-160px;background:radial-gradient(circle,rgba(255,190,225,.5),transparent 70%);transform:translate(calc(var(--px)*18px),calc(var(--py)*-14px))}
@keyframes dr1{to{margin:40px 0 0 30px}}@keyframes dr2{to{margin:-30px 24px 0 0}}

.pill:active{transform:scale(.94)}

.hero .lg{position:relative;width:118px;height:118px;margin:0 auto;border-radius:28px;box-shadow:0 2px 3px rgba(40,50,110,.25),0 18px 36px rgba(50,60,130,.38),0 8px 18px rgba(53,180,255,.25),0 0 0 1px rgba(255,255,255,.7)}

.hero .lg:after{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(115deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.08) 28%,transparent 40%,transparent 70%,rgba(255,255,255,.12));mix-blend-mode:screen;pointer-events:none}
.hero .rf{width:118px;height:30px;margin:6px auto 0;border-radius:50%;background:radial-gradient(ellipse,rgba(70,130,255,.28),transparent 70%);filter:blur(6px)}
.hero h1{margin:8px 0 0;font-size:18px;letter-spacing:.34em;font-weight:800;padding-left:.34em;background:linear-gradient(90deg,#0b86b4,#5a5cf0 55%,#8a4dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 4px rgba(90,90,200,.25))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 6px;justify-items:center}
.app{width:100%;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font:inherit;animation:pop .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}
.nm{font-size:12.5px;line-height:1.15;text-align:center;max-width:100px;overflow-wrap:anywhere;font-weight:600;color:var(--ink)}
/* glossy app icon: rounded square, glass gloss, grain, inner bevel, layered shadow */
.ic{position:relative;width:76px;height:76px;border-radius:19px;background:#0b1024 center/cover no-repeat;
 box-shadow:0 1px 1px rgba(30,40,100,.35),0 4px 8px rgba(40,50,110,.22),0 12px 22px rgba(50,60,130,.25),0 0 0 1px rgba(255,255,255,.9),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -8px 14px rgba(0,0,0,.18);
 display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.3,1.4,.5,1)}
.ic:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.1) 26%,transparent 46%),var(--grain);background-blend-mode:normal,overlay}
.app:active .ic,.app:active .fold{transform:scale(.9)}
.ic.tile{background:linear-gradient(135deg,#3a2a9a,#0e4a66);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.ic.plan{background:rgba(255,255,255,.6);border:2px dashed rgba(11,134,180,.55);color:var(--ac);font-weight:800;box-shadow:0 8px 18px rgba(60,70,130,.15)}
.ic.start{background:rgba(255,255,255,.6);border:2px dashed rgba(90,100,150,.35);color:var(--dim);font-size:24px;box-shadow:0 8px 18px rgba(60,70,130,.12)}
.ic.plan:after,.ic.start:after{display:none}

.fold{position:relative;width:96px;height:78px;transition:transform .15s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 12px 10px rgba(50,60,130,.3)) drop-shadow(0 2px 2px rgba(40,50,110,.35));--h:210}

.fold .fr{position:absolute;left:0;right:0;bottom:0;height:50px;border-radius:7px 7px 15px 15px;transform-origin:50% 100%;
 background:linear-gradient(180deg,hsla(var(--h),90%,96%,.30) 0,hsla(var(--h),90%,90%,.06) 45%,hsla(var(--h),90%,68%,.22) 100%),var(--brush);
 backdrop-filter:saturate(1.25);-webkit-backdrop-filter:saturate(1.25);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -2px 0 hsla(var(--h),60%,40%,.28),0 1px 2px rgba(30,40,100,.25);transition:transform .35s cubic-bezier(.3,1,.4,1)}
.fold .fr:before{content:"";position:absolute;left:8%;top:5px;width:55%;height:9px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,0));filter:blur(.6px)}
.fold .fr:after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grain);opacity:.18;mix-blend-mode:overlay;pointer-events:none}
.app:hover .fold .fr{transform:rotateX(18deg)}.app:hover .fold .pp{transform:rotate(-2.5deg) translateY(-5px)}
/* folder-opening transition */
.fly{position:fixed;z-index:40;pointer-events:none;perspective:600px;transform-origin:50% 50%;transition:transform .62s cubic-bezier(.5,0,.2,1),opacity .35s ease .4s}
.fly .fold{width:100%;height:100%;filter:drop-shadow(0 18px 26px rgba(50,60,130,.4))}
.fly.fgo .fr{transform:rotateX(78deg);transition:transform .5s cubic-bezier(.3,1,.4,1)}
.fly.fgo .pp{transform:rotate(0) translateY(-14px) scale(1.08)}
.flash{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(circle at var(--fx,50%) var(--fy,40%),rgba(255,255,255,.9),rgba(140,200,255,.45) 28%,transparent 62%);opacity:0;transition:opacity .45s}
.flash.on{opacity:1}
.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.sheet{position:relative;margin-top:10px;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.95);
 background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(255,255,255,.7) 45%,rgba(240,244,255,.85)),var(--brush);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
 box-shadow:0 2px 3px rgba(40,50,110,.18),0 14px 24px rgba(50,60,130,.18),0 34px 60px rgba(50,60,130,.22),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(120,130,190,.2)}
.sheet:after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grainD);opacity:.22;mix-blend-mode:multiply;pointer-events:none}
.sheet .pic{position:relative;aspect-ratio:16/9;background:#0b1024 center/cover no-repeat;box-shadow:inset 0 -24px 30px -20px rgba(30,40,100,.35)}
.sheet .pic:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.28) 0,transparent 30%)}
.sheet .pic.logo{background-size:contain}
.sheet .in{position:relative;padding:16px 18px 18px;z-index:1}
.sheet h2{margin:0 0 2px;font-size:22px;letter-spacing:-.01em}
.sheet .sb{color:hsl(var(--ph,200) 75% 36%);font-weight:600;font-size:14px;margin:0 0 2px}
.sheet .dt{color:var(--dim);font-size:13px;margin-bottom:10px}
.sheet ul{margin:0 0 16px;padding-left:19px;color:#2a3555}.sheet li{margin:4px 0}
.go{position:relative;display:block;width:100%;text-align:center;text-decoration:none;font-weight:800;letter-spacing:.16em;font-size:15px;color:#06202e;background:linear-gradient(180deg,#a6f3ff,#35e0ff 45%,#6a8cff 100%);border-radius:15px;padding:15px;overflow:hidden;
 box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -3px 6px rgba(20,40,140,.35) inset,0 8px 0 -4px rgba(10,40,100,.5),0 14px 26px rgba(53,224,255,.35);transition:transform .12s}
.go:after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.go:active{transform:translateY(3px) scale(.985)}
.go.off{background:rgba(60,70,130,.07);color:var(--dim);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);letter-spacing:.06em;font-weight:600;font-size:13px}.go.off:after{display:none}
.fn{color:var(--dim);font-size:12px;margin:9px 2px 0;text-align:center}
.note{color:var(--dim);font-size:11.5px;text-align:center;margin-top:34px;opacity:.8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<main>

</main>
<script>
(function(){

  /* ---------- helpers ---------- */

    var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1];return mo+" "+(+m[3])+", "+m[1]+(m[4]&&!dOnly?" · "+m[4]+" Israel time":"")}

    var pp=el("div","pp"+(p.icon?"":" t"));if(p.icon)bg(pp,p.icon);else pp.textContent=p.tile||p.name.charAt(0);f.appendChild(pp);f.appendChild(el("div","fr"));return f}

    var h=el("div","hero"),lg=el("div","lg"),im=el("img");im.src="a/tessie_logo.webp";im.alt="";im.width=118;im.height=118;lg.appendChild(im);h.appendChild(lg);h.appendChild(el("div","rf"));h.appendChild(el("h1",null,"TESSIE FOLDER"));
    view.innerHTML="";view.appendChild(h);var g=el("div","grid");
    D.projects.forEach(function(p,i){var b=el("button","app");b.appendChild(foldEl(p,i));b.appendChild(el("div","nm",p.name));

  function back(to,label){top.innerHTML="";var b=el("button","pill","‹ "+label);b.onclick=function(){snd("back");go(to)};top.appendChild(b);return b}

    s.appendChild(pic);var n=el("div","in");n.appendChild(el("h2",null,x.label));if(x.title)n.appendChild(el("div","sb",x.title));

  /* folder-opening animation: the tapped folder flies to centre, its front panel swings open, light blooms, then the project grid pops in */
  var busy=false;
  function openAnim(btn,done){if(busy)return;busy=true;var f=btn.querySelector(".fold"),r=f.getBoundingClientRect(),fl=el("div","fly"),cl=f.cloneNode(true);

    var fx=el("div","flash");fx.style.setProperty("--fx",(r.left+r.width/2)+"px");fx.style.setProperty("--fy",(r.top+r.height/2)+"px");document.body.appendChild(fx);f.style.visibility="hidden";

    setTimeout(function(){fl.remove();fx.remove();busy=false},1000)}
  function go(h){if(location.hash!==h)location.hash=h;else route()}
  function route(){if(!D)return;var m=/^#\/([^\/]*)\/?([^\/]*)$/.exec(location.hash||"#/"),pid=m&&m[1],iid=m&&m[2];window.scrollTo(0,0);
    var p=D.projects.filter(function(q){return q.id===pid})[0];
    if(p)root.style.setProperty("--ph",HUES[D.projects.indexOf(p)%HUES.length]);
    if(!p)return home();if(!iid)return folder(p);if(iid==="next"&&p.next)return nextSheet(p);
    var x=p.items.filter(function(q){return q.id===iid})[0];x?sheet(p,x):folder(p)}
  window.addEventListener("hashchange",function(){if(!busy)route();else setTimeout(route,0)});
  /* parallax: pointer / touch / device tilt move the aurora layers and tilt the hero */
  function par(x,y){root.style.setProperty("--px",(x*2-1).toFixed(3));root.style.setProperty("--py",(y*2-1).toFixed(3))}
  addEventListener("pointermove",function(e){par(e.clientX/innerWidth,e.clientY/innerHeight)},{passive:true});
  addEventListener("deviceorientation",function(e){if(e.gamma==null)return;par(Math.max(0,Math.min(1,(e.gamma+30)/60)),Math.max(0,Math.min(1,(e.beta-20)/50)))},{passive:true});
  /* tap sound on every press (capture phase) except buttons that play their own sound */
  document.addEventListener("pointerdown",function(e){var b=e.target.closest&&e.target.closest("button,a");if(b&&!b.classList.contains("app")&&!b.classList.contains("pill")&&!b.classList.contains("go"))snd("tap")},true);
  window.__tf={snd:snd,mute:function(v){muted=v}};
  fetch("builds.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){D=d;
    document.getElementById("note").textContent="Updated "+fmt(d.updated);route()}).catch(function(){view.textContent="Could not load builds.json"});
})();

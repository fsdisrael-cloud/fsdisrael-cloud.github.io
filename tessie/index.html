<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090b"><meta name="robots" content="noindex">
<title>TESSIE FOLDER</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Stencil;src:url(BlackOpsOne.ttf) format("truetype");font-display:swap}
:root{--bg:#07090b;--panel:#12161b;--panel2:#0d1014;--line:#2c333c;--ink:#d6dde6;--dim:#8b96a4;--or:#e8892a;--grn:#4dffa6}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
 background-image:repeating-linear-gradient(135deg,rgba(232,137,42,.035) 0 14px,transparent 14px 28px),radial-gradient(1000px 420px at 50% -8%,#1f2730,transparent 70%);
 padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 50px max(14px,env(safe-area-inset-left))}
main{max-width:820px;margin:0 auto}
.hero{text-align:center;padding:4px 0 6px}
.hero img{width:min(100%,560px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 10px 28px rgba(232,137,42,.28))}
.sub{color:var(--dim);font-size:12.5px;text-align:center;letter-spacing:.14em;text-transform:uppercase;margin:2px 0 22px}
.grid{display:grid;gap:16px}
.proj{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.proj:before,.proj:after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#aab6c4,#3a424d 70%);box-shadow:0 1px 1px #000;z-index:2}
.proj:before{left:8px}.proj:after{right:8px}
.ph{display:grid;grid-template-columns:150px 1fr;gap:0;border-bottom:2px solid var(--or)}
.th{background:#05070a center/cover no-repeat;min-height:100px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.th.none{background:repeating-linear-gradient(135deg,#171c22 0 10px,#0e1216 10px 20px)}
.th.none span{font:400 38px Stencil,Impact,sans-serif;color:#aab6c4;text-shadow:0 2px 0 #000}
.pi{padding:12px 14px}
.pi h2{font:400 21px/1.1 Stencil,Impact,sans-serif;letter-spacing:.08em;margin:0 0 4px;color:#fff;text-transform:uppercase;text-shadow:0 0 14px rgba(232,137,42,.35)}
.pi p{margin:0 0 6px;color:var(--dim);font-size:13px}
.pi a{color:var(--grn);font-size:13px;text-decoration:none;font-weight:600}
.body{padding:10px 12px 12px}
.card{background:#0a0d11;border:1px solid var(--line);border-left:4px solid var(--or);border-radius:3px;padding:8px 11px;margin:0 0 8px}
.card.next{border-left-color:var(--grn);border-style:dashed;border-left-style:solid;background:#0b1511}
.t{display:flex;flex-wrap:wrap;gap:1px 10px;align-items:baseline}
.b{font:400 15.5px Stencil,Impact,sans-serif;letter-spacing:.05em;color:#fff}.card.next .b{color:var(--grn)}
.ti{font-weight:600;font-size:13.5px}.d{color:var(--dim);font-size:12px;margin-left:auto}
.card.start{border-left-color:#4a5360;opacity:.85}
ul{margin:5px 0 0;padding-left:18px;color:#b4becb;font-size:13.5px}li{margin:2px 0}
.more{width:100%;background:#161b21;color:var(--or);border:1px solid var(--line);border-radius:3px;padding:9px;font:600 13px system-ui;letter-spacing:.08em;text-transform:uppercase}
.note{color:var(--dim);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:10px;text-align:center}
@media(max-width:480px){.ph{grid-template-columns:104px 1fr}.pi h2{font-size:18px}.pi{padding:10px}}
</style></head><body><main>
<div class="hero"><img src="img/logo.webp" alt="TESSIE FOLDER" width="1000" height="563"></div>
<div class="sub" id="sub">Loading…</div>
<div class="grid" id="root"><noscript>Enable JavaScript to see the project list (data in builds.json).</noscript></div>
<div class="note">Version history of every project · All times are Israel time · Newest first · Entries without a date were not recorded.</div>
</main>
<script>
(function(){
  var root=document.getElementById("root"),SHOW=4;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function fmt(s,dOnly){var m=/^(\d{4})-(\d\d)-(\d\d)(?: (\d\d:\d\d))?$/.exec(s||"");if(!m)return "date not recorded";
    var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2]-1];return mo+" "+(+m[3])+", "+m[1]+(m[4]&&!dOnly?" · "+m[4]:"")}
  function card(b){var c=el("div","card"+(/starts here/.test(b.label)?" start":"")),t=el("div","t");
    t.appendChild(el("span","b",b.label));if(b.title)t.appendChild(el("span","ti",b.title));t.appendChild(el("span","d",fmt(b.when,b.dateOnly)));
    c.appendChild(t);var u=el("ul");(b.bullets||[]).forEach(function(x){u.appendChild(el("li",null,x))});c.appendChild(u);return c}
  fetch("builds.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(D){
    document.getElementById("sub").textContent="Updated "+fmt(D.updated)+" (Israel time)";
    D.projects.forEach(function(p){
      var s=el("section","proj"),h=el("div","ph"),th=el("div","th"+(p.thumb?"":" none"));
      if(p.thumb){th.style.backgroundImage="url("+p.thumb+")";if(p.fit)th.style.backgroundSize=p.fit}else th.appendChild(el("span",null,p.name.charAt(0)));
      h.appendChild(th);var pi=el("div","pi");pi.appendChild(el("h2",null,p.name));if(p.blurb)pi.appendChild(el("p",null,p.blurb));
      if(p.url){var a=el("a",null,"Open ↗");a.href=p.url;pi.appendChild(a)}
      h.appendChild(pi);s.appendChild(h);var body=el("div","body");
      if(p.next){var n=el("div","card next"),t=el("div","t");t.appendChild(el("span","b","Next: "+p.next.label+" (planned)"));
        n.appendChild(t);n.appendChild(el("div","ti",p.next.note||"Being collected."));body.appendChild(n)}
      var E=p.entries||[],hidden=[];
      E.forEach(function(b,i){var c=card(b);if(i>=SHOW){c.style.display="none";hidden.push(c)}body.appendChild(c)});
      if(hidden.length){var m=el("button","more","Show all "+E.length+" entries");m.onclick=function(){hidden.forEach(function(c){c.style.display=""});m.remove()};body.appendChild(m)}
      s.appendChild(body);root.appendChild(s)});
  }).catch(function(){document.getElementById("sub").textContent="Could not load builds.json"});
})();
</script></body></html>

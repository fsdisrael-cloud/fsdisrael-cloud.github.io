<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X-BASS">
<meta name="theme-color" content="#07070a">
<title>X-BASS</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1.9">
<script>
(function () {
  function fit() {
    document.documentElement.classList.toggle("portrait", window.innerHeight > window.innerWidth + 8);
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
})();
</script>
</head>
<body>
<main id="app">

  <section id="view-home" class="view on">
    <img class="home-bg" src="img/home.jpg" alt="" decoding="async">
    <div class="home-chrome">
      <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      <button class="nav-btn" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
    </div>
    <button id="hit-new" class="hit" type="button" data-aria="newPlayer" aria-label="New player"></button>
    <button id="hit-saved" class="hit" type="button" data-aria="savedPlayers" aria-label="Saved players"></button>
    <button id="hit-go" class="hit" type="button" data-aria="continue" aria-label="Continue"></button>
    <button id="hit-gear" class="hit" type="button" data-aria="settings" aria-label="Settings"></button>
    <div class="ver">v1.9</div>
  </section>

  <section id="view-players" class="view">
    <header class="bar">
      <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      <button class="nav-btn" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
      <h1 data-i="savedPlayers">SAVED PLAYERS</h1>
    </header>
    <div class="sheet">
      <ul id="player-list" class="list"></ul>
    </div>
  </section>

  <section id="view-song" class="view">
    <header class="bar">
      <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      <button class="nav-btn" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
      <h1 data-i="song">SONG</h1>
      <span id="song-who" class="who"></span>
      <span id="status-song" class="status"></span>
      <span class="spacer"></span>
      <button class="text-btn" type="button" data-nav="tuner" data-i="tuner">TUNER</button>
    </header>
    <div class="sheet">
      <form id="find-form" class="song-form">
        <input id="find-q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Song or artist" data-ph="searchPh">
        <button class="play-go" type="submit" data-i="search">SEARCH</button>
      </form>
      <div id="find-results" class="find-results"></div>
      <form id="song-form" class="song-form">
        <input id="song-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://youtu.be/…" data-ph="paste">
        <button class="play-go" type="submit" data-i="play">PLAY</button>
      </form>
      <p id="song-error" class="error" hidden></p>
      <button id="upload-btn" class="ghost-btn" type="button" data-i="upload">Upload mp3/mp4</button>
      <input id="file-input" type="file" accept="audio/*,video/*,.mp3,.mp4,.m4a,.wav,.webm" hidden>
      <h2 data-i="recent">RECENT</h2>
      <div id="recent-list" class="recents"></div>
    </div>
  </section>

  <section id="view-play" class="view">
    <div class="top-band">
      <div class="nav-col">
        <button class="nav-btn" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
        <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      </div>
      <div class="staff-col">
        <div class="lane">
          <button id="btn-sync-notes" class="sync-btn" type="button" data-i="sync" data-aria="syncNotes">Sync</button>
          <div class="strip-box" id="strip-box">
            <div id="note-strip" class="strip"></div>
            <div id="loop-span" class="loop-span"></div>
            <button id="loop-a" class="loop-mark" type="button" data-which="a" data-aria="loopStart" aria-label="Loop start"></button>
            <button id="loop-b" class="loop-mark" type="button" data-which="b" data-aria="loopEnd" aria-label="Loop end"></button>
          </div>
        </div>
        <div class="lane lyric-lane">
          <button id="btn-sync-lyrics" class="sync-btn" type="button" data-i="sync" data-aria="syncLyrics">Sync</button>
          <div id="lyric-strip" class="lyric-bar"><span class="lyric-ph">· · ·</span></div>
        </div>
      </div>
    </div>
    <div class="stage-row">
      <div class="side-logo" aria-hidden="true">
        <svg viewBox="0 0 48 220">
          <defs>
            <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".42" stop-color="#9aa3ae"/>
              <stop offset=".72" stop-color="#f5f7f8"/>
              <stop offset="1" stop-color="#5c656e"/>
            </linearGradient>
          </defs>
          <text x="34" y="16" fill="url(#chromeV)" stroke="#141414" stroke-width="1.6" font-family="Arial Black, Impact, sans-serif" font-size="26" font-weight="800" transform="rotate(90 34 16)">BASS</text>
          <path fill="#4a080e" d="M8 158 L24 174 L8 190 L14 190 L24 180 L34 190 L40 190 L24 174 L40 158 L34 158 L24 168 L14 158 Z"/>
          <path fill="#e1061c" stroke="#141414" stroke-width="1.6" d="M7 152 L24 169 L7 186 L14 186 L24 176 L34 186 L41 186 L24 169 L41 152 L34 152 L24 162 L14 152 Z"/>
          <path fill="#ff8a93" d="M14 156 L22 164 L16 164 Z"/>
        </svg>
      </div>
      <div class="stage">
      <svg id="stage-svg" viewBox="0 0 1600 540" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f9c9d8"/>
            <stop offset="1" stop-color="#f29db8"/>
          </linearGradient>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8e2c2"/>
            <stop offset=".5" stop-color="#e8c392"/>
            <stop offset="1" stop-color="#d9b07a"/>
          </linearGradient>
          <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8e6c8"/>
            <stop offset="1" stop-color="#e4c094"/>
          </linearGradient>
          <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe7d8"/>
            <stop offset=".42" stop-color="#f6cbb6"/>
            <stop offset="1" stop-color="#e4aa96"/>
          </linearGradient>
          <radialGradient id="nail" cx="32%" cy="28%" r="80%">
            <stop offset="0" stop-color="#ffe4e8"/>
            <stop offset=".2" stop-color="#ff6674"/>
            <stop offset=".5" stop-color="#e1062c"/>
            <stop offset="1" stop-color="#8e0c20"/>
          </radialGradient>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7f9fb"/>
            <stop offset=".5" stop-color="#d5dbe3"/>
            <stop offset="1" stop-color="#f4f6f8"/>
          </linearGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="1600" height="252" fill="#c5ebf8"/>
        <path fill="#f7b7cc" d="M0 0h1120c90 0 150 28 168 70 10 24 12 70 4 110-14 52-80 72-168 72H0Z"/>
        <path fill="#fde7ef" d="M0 0h1120c70 8 120 30 140 58H0Z" opacity=".55"/>
        <path fill="#fff" stroke="#eceff3" stroke-width="3" d="M520 18h520c78 0 108 36 96 84l-34 108H548c-70 0-96-46-78-96 12-34 18-96 50-96z"/>
        <g fill="#e7eaee" stroke="#b7bec6">
          <circle cx="560" cy="42" r="6"/><circle cx="980" cy="40" r="6"/>
          <circle cx="548" cy="176" r="6"/><circle cx="990" cy="168" r="6"/>
        </g>
        <rect x="1120" y="16" width="480" height="220" fill="#efd0a4"/>
        <rect x="1120" y="16" width="480" height="220" fill="url(#wood)"/>
        <rect x="1552" y="12" width="16" height="228" rx="3" fill="#f6f3ec" stroke="#e2c396"/>
        <path fill="#f3d7b0" stroke="#d7b48a" stroke-width="2" d="M1566 20h34v212h-34z"/>
        <circle cx="1582" cy="126" r="11" fill="#e7ebf0" stroke="#9aa3ad" stroke-width="2"/>
        <circle cx="1582" cy="126" r="4" fill="#9aa3ad"/>
        <g id="top-frets"></g>
        <g id="pickups"></g>
        <g id="top-strings"></g>
        <g transform="translate(8,62)">
          <rect width="58" height="150" rx="4" fill="#eef1f4" stroke="#9aa3ad" stroke-width="2"/>
          <rect x="7" y="8" width="44" height="134" rx="2" fill="#fbfcfd" stroke="#c5ccd4"/>
          <g fill="#9aa3ad">
            <rect x="10" y="16" width="38" height="9" rx="2"/>
            <rect x="10" y="44" width="38" height="9" rx="2"/>
            <rect x="10" y="72" width="38" height="9" rx="2"/>
            <rect x="10" y="100" width="38" height="9" rx="2"/>
          </g>
          <g fill="#d5dbe2">
            <rect x="48" y="22" width="16" height="6" rx="1"/>
            <rect x="48" y="50" width="16" height="6" rx="1"/>
            <rect x="48" y="78" width="16" height="6" rx="1"/>
            <rect x="48" y="106" width="16" height="6" rx="1"/>
          </g>
        </g>
        <g id="pluck-hand"></g>
        <rect x="0" y="250" width="1600" height="18" fill="#d9f4fc"/>
        <g id="board"></g>
        <g id="fret-hand"></g>
      </svg>
      </div>
    </div>
    <div id="media-slot" class="media-slot"></div>
    <footer class="transport">
      <button id="btn-song" class="pill" type="button" data-nav="song" data-i="song">SONG</button>
      <div class="faders">
        <button class="fader" type="button" data-mute="guitar"><span class="stem"><i></i></span><span data-i="guitar">GUITAR</span></button>
        <button class="fader" type="button" data-mute="piano"><span class="stem"><i></i></span><span data-i="piano">PIANO</span></button>
        <button class="fader" type="button" data-mute="vocals"><span class="stem"><i></i></span><span data-i="vocals">VOCALS</span></button>
        <button class="fader" type="button" data-mute="drums"><span class="stem"><i></i></span><span data-i="drums">DRUMS</span></button>
      </div>
      <div class="bpm">
        <button id="bpm-tap" type="button" data-aria="tap" aria-label="Tap tempo">♩</button>
        <button id="bpm-dec" type="button" aria-label="BPM down">−</button>
        <div class="bpm-read"><b id="bpm-val">96</b><small>BPM</small></div>
        <button id="bpm-inc" type="button" aria-label="BPM up">+</button>
      </div>
      <label class="speed">
        <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1">
        <span id="speed-val">1.00×</span>
      </label>
      <button id="btn-back" class="round jump" type="button" aria-label="Back 10 seconds">−10</button>
      <button id="btn-play" class="round" type="button" data-aria="play" aria-label="Play">▶</button>
      <button id="btn-fwd" class="round jump" type="button" aria-label="Forward 10 seconds">+10</button>
      <button class="round tuner-ear" type="button" data-nav="tuner" data-aria="tuner" aria-label="Tuner"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M15 24.5c-2.2 2.4-2.2 12.6 0 15"/><path d="M9.5 20.5c-3.4 4-3.4 19 0 23"/><path d="M49 24.5c2.2 2.4 2.2 12.6 0 15"/><path d="M54.5 20.5c3.4 4 3.4 19 0 23"/></g><path fill="#fff" d="M39.2 12.6c-6.2-4.6-15.4-2.2-18.6 5.2-1.8 4.2-1.2 8.2 1.2 11.2-2.2 2.2-3.2 5.4-2.4 8.6 1.1 4.4 5.2 7 9.6 6.6 1.4 3.2 4.8 5.6 8.8 5 4.6-.6 7.8-4.6 7.6-9.2 2.4-1.2 4.2-4 4.2-7.4 0-4.2-2.6-7.6-5.6-9 .6-4.2-.6-8.2-5-11z"/><path fill="#111" d="M35.4 22.8c-3.2.4-5.4 3.2-5 6.2.3 2.4 2.4 4 4.8 3.8.2 2.8-.6 5.4-2.8 6.8 2.8 1.2 6.2.4 7.6-2.2.8-1.6.6-3.4-.4-4.8 2-1.4 3-3.8 2.4-6.2-.8-3-3.6-4.8-6.6-4.4z"/></svg></button>
      <button id="btn-loop" class="round ghost" type="button" data-aria="loop" aria-label="Loop" aria-pressed="false">∞</button>
    </footer>
  </section>

  <section id="view-tuner" class="view">
    <header class="bar tuner-bar">
      <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      <button class="nav-btn light" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
      <h1 class="logo-type">X-BASS <span class="pipe">|</span> <span data-i="tuner">TUNER</span></h1>
    </header>
    <div class="tune-body">
      <div class="gauge-col">
        <div class="gauge-wrap">
          <svg class="gauge" viewBox="0 0 400 210">
            <defs>
              <linearGradient id="arcg" x1="0" x2="1">
                <stop offset="0" stop-color="#e1061c"/>
                <stop offset=".42" stop-color="#e1061c"/>
                <stop offset=".5" stop-color="#2fce45"/>
                <stop offset=".58" stop-color="#e0b000"/>
                <stop offset="1" stop-color="#e0b000"/>
              </linearGradient>
            </defs>
            <path d="M60 176 A140 140 0 0 1 340 176" fill="none" stroke="url(#arcg)" stroke-width="18"/>
            <g id="needle">
              <polygon points="200,44 194,176 206,176" fill="#f4f4f4"/>
              <circle cx="200" cy="176" r="9" fill="#eee" stroke="#9aa" stroke-width="2"/>
            </g>
          </svg>
          <div class="gauge-read">
            <div id="tune-name">A</div>
            <div id="tune-cents">—</div>
            <div class="cents-word" data-i="cents">CENTS</div>
          </div>
        </div>
        <div class="tune-scale">
          <div id="lab-flat"><b data-i="flat">FLAT</b><span data-i="tuneUp">TUNE UP</span></div>
          <div id="lab-ok"><b data-i="inTune">IN TUNE</b></div>
          <div id="lab-sharp"><b data-i="sharp">SHARP</b><span data-i="tuneDown">TUNE DOWN</span></div>
        </div>
        <button id="mic-btn" class="mic" type="button" hidden data-i="enableMic">Enable microphone</button>
        <p id="mic-msg" class="mic-msg" hidden></p>
      </div>
      <div class="head-col">
        <svg id="head-svg" viewBox="0 0 640 320">
          <defs>
            <linearGradient id="hwood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0d2a4"/>
              <stop offset="1" stop-color="#e2b888"/>
            </linearGradient>
            <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M0 0 L8 4 L0 8 Z" fill="#fff"/>
            </marker>
          </defs>
          <rect x="0" y="96" width="268" height="148" rx="2" fill="url(#hwood)" stroke="#1b1b1b" stroke-width="3"/>
          <g id="hs-frets"></g>
          <path d="M280 88 L460 64 L608 86 L624 170 L600 248 L450 266 L280 242 Z" fill="#f3d7b2" stroke="#1b1b1b" stroke-width="3"/>
          <rect x="264" y="90" width="18" height="160" rx="2" fill="#f7f4ee" stroke="#222" stroke-width="2"/>
          <g id="hs-strings"></g>
          <g id="hs-pegs"></g>
          <g id="hs-hand"></g>
          <g id="hs-arrow"></g>
        </svg>
      </div>
    </div>
    <div class="str-btns" id="str-btns">
      <button type="button" data-string="0">E</button>
      <button type="button" data-string="1" class="on">A</button>
      <button type="button" data-string="2">D</button>
      <button type="button" data-string="3">G</button>
    </div>
  </section>

  <section id="view-settings" class="view">
    <header class="bar">
      <button class="nav-btn" type="button" data-nav="back" data-aria="back" aria-label="Back">←</button>
      <button class="nav-btn" type="button" data-nav="home" data-aria="home" aria-label="Home">⌂</button>
      <h1 data-i="settings">SETTINGS</h1>
    </header>
    <div class="sheet">
      <h2 data-i="language">LANGUAGE</h2>
      <div class="lang-row">
        <button id="lang-en" class="lang on" type="button">English</button>
        <button id="lang-he" class="lang" type="button">עברית</button>
      </div>
      <button class="play-go block" type="button" data-nav="tuner" data-i="tuner">TUNER</button>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <form id="name-form" class="dialog">
      <h2 data-i="playerName">Player name</h2>
      <input id="name-input" maxlength="24" required autocomplete="nickname">
      <div class="dialog-row">
        <button type="button" id="name-cancel" data-i="back">Back</button>
        <button type="submit" data-i="save">Save</button>
      </div>
    </form>
  </div>
  <div id="rotate-gate">
    <div class="rotate-phone" aria-hidden="true"></div>
    <p data-i="rotate">Rotate your phone</p>
  </div>
</main>
<script src="js/score.js?v=1.9"></script>
<script src="js/app.js?v=1.9"></script>
</body>
</html>

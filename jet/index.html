<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ubu-build" content="27" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JET-X" />
  <meta name="theme-color" content="#0b0a1f" />
  <meta name="format-detection" content="telephone=no" />
  <title>JET-X</title>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png" />
  <link rel="preload" href="fonts/Fredoka.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/jet.css?v=27" />
  <link rel="stylesheet" href="css/loading.css?v=27" />
  <script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body class="on-title tp-a">
  <!-- iOS 18+ best-effort haptic tick (see js/haptics.js) -->
  <input id="ios-haptic-switch" type="checkbox" switch aria-hidden="true" tabindex="-1" />
  <label id="ios-haptic-label" for="ios-haptic-switch" aria-hidden="true"></label>

  <canvas id="game-canvas"></canvas>
  <canvas id="hud-canvas"></canvas>

  <!-- ===== Settings (top right): gear + Music / Effects toggles. Open on the opening screen, tap the gear to open in play ===== -->
  <div id="settings" class="settings">
    <div id="toggles" class="toggles">
      <button type="button" class="tgl" id="btn-music" aria-label="Music on/off">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.6" fill="currentColor"/><circle cx="17" cy="16" r="2.6" fill="currentColor"/><path class="slash" d="M3 3 21 21" stroke="#ff4d4d" stroke-width="2.6" stroke-linecap="round"/></svg><span>Music</span>
      </button>
      <button type="button" class="tgl" id="btn-sfx" aria-label="Effects on/off">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M3 3 21 21" stroke="#ff4d4d" stroke-width="2.6" stroke-linecap="round"/></svg><span>Effects</span>
      </button>
      <button type="button" class="tgl" id="btn-tilt" aria-label="Tilt steering on/off">
        <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.4" fill="none" stroke="currentColor" stroke-width="2.2" transform="rotate(18 12 12)"/><path class="slash" d="M3 3 21 21" stroke="#ff4d4d" stroke-width="2.6" stroke-linecap="round"/></svg><span>Tilt</span>
      </button>
      <button type="button" class="tgl off" id="btn-invert" aria-label="Invert pitch">
        <svg viewBox="0 0 24 24"><path d="M8 4 3.5 10h3v10h3V10h3zM16 20l4.5-6h-3V4h-3v10h-3z" fill="currentColor"/><path class="slash" d="M3 3 21 21" stroke="#ff4d4d" stroke-width="2.6" stroke-linecap="round"/></svg><span>Invert</span>
      </button>
      <button type="button" class="tgl" id="btn-assist" aria-label="Flight assist on/off">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 17h5l3 4 3-4h5z" fill="currentColor"/><path class="slash" d="M3 3 21 21" stroke="#ff4d4d" stroke-width="2.6" stroke-linecap="round"/></svg><span>Assist</span>
      </button>
      <button type="button" class="tgl no-i18n" id="btn-lang2" aria-label="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>English</span></button>
    </div>
    <button type="button" class="tgl gear" id="btn-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8.2 4.4v-2l-2.1-.5a6.6 6.6 0 0 0-.7-1.6l1.1-1.9-1.4-1.4-1.9 1.1a6.6 6.6 0 0 0-1.6-.7L13 3.8h-2l-.5 2.1a6.6 6.6 0 0 0-1.6.7L7 5.5 5.6 6.9l1.1 1.9c-.3.5-.5 1-.7 1.6l-2.1.5v2l2.1.5c.2.6.4 1.1.7 1.6l-1.1 1.9L7 17.3l1.9-1.1c.5.3 1 .5 1.6.7l.5 2.1h2l.5-2.1c.6-.2 1.1-.4 1.6-.7l1.9 1.1 1.4-1.4-1.1-1.9c.3-.5.5-1 .7-1.6z" fill="currentColor"/></svg><span>Settings</span>
    </button>
  </div>

  <!-- ===== Opening screen (one screen, shown once) ===== -->
  <section id="screen-title" class="screen title">
    <div class="ver-b" data-ver></div>
    <div class="sky-fx" aria-hidden="true"><i class="aurora a1"></i><i class="aurora a2"></i><i class="aurora a3"></i><i class="stars"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="horizon"></i></div>
    <div class="title-inner t26">
      <div class="t26-top">
        <div class="t26-plate" role="img" aria-label="JET-X">
          <i class="hz hz-t"></i><i class="hz hz-b"></i><i class="rv r1"></i><i class="rv r2"></i><i class="rv r3"></i><i class="rv r4"></i>
          <img class="t26-letters" src="img/logo7_letters.webp" alt="" draggable="false">
        </div>
        <div class="t26-lang no-i18n">
          <button type="button" id="lang-btn" class="t26-langbtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <svg class="t26-mic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            <span id="lang-cur">English</span><i class="t26-car"></i>
          </button>
          <div id="lang-list" class="t26-langlist hidden" role="listbox"></div>
        </div>
      </div>
      <div class="scene-label" id="scene-label"></div>
      <div id="menu-buttons" class="menu-buttons plates t26-sec"></div>
      <div class="sec-links" id="sec-links"></div>
      <button type="button" class="plate reroll" id="btn-reroll" aria-label="Choose scenery"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><g fill="currentColor"><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><circle cx="8.5" cy="15.5" r="1.5"/></g></svg><span class="no-i18n">SCENERY</span></button>
      <div class="t26-bottom">
        <button type="button" id="tap-fly" class="t26-tap"><i class="hz hz-t"></i><span class="t26-tapt">TAP TO FLY</span><i class="hz hz-b"></i></button>
        <div class="t26-by"><svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><path d="M5 6h38L24 44z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M15 12h18v5h-6.5v14h-5V17H15z" fill="currentColor"/></svg><span>by TESSIE</span></div>
      </div>
      <div class="tap-prompt" id="tap-prompt" style="display:none"></div>
    </div>
    <div id="panel" class="panel hidden" role="dialog">
      <div class="panel-card"><h2 id="panel-title"></h2><div id="panel-body"></div><button type="button" class="metal-btn small" id="panel-close"><i class="led"></i><span>OK</span></button></div>
    </div>
  </section>

  <div id="nv" class="nv" aria-hidden="true"><i class="nv-vig"></i><i class="nv-scan"></i><i class="nv-noise"></i></div>
  <!-- ===== In-game HUD ===== -->
  <div id="hud" class="hud">
    <div class="radar-wrap">
      <canvas id="radar" aria-label="Radar"></canvas>
      <button type="button" class="view-btn" id="btn-view" aria-label="Camera view: cockpit or chase"><span class="vseg" data-v="cockpit">COCKPIT</span><span class="vseg" data-v="chase">CHASE</span></button>
      <button type="button" class="view-btn nv-btn" id="nv-btn" aria-label="Night vision"><span class="vseg">NVG</span></button>
      <div class="wcam" id="wcam" aria-label="Weapon camera"><canvas id="wcam-c" width="160" height="160"></canvas><i class="wcam-ring"></i></div>
    </div>
    <canvas id="rain-canopy"></canvas>
    <div id="splash" class="splash"></div>
    <div id="hint" class="hint"></div>
    <div id="popups" class="popups"></div>
    <div id="hitmark" class="hitmark"><i></i><i></i><i></i><i></i></div>
    <div id="ops-panel" class="ops hidden"><div class="ops-title" id="ops-title">LOADING</div>
        <div class="ops-bars"><div><span id="ops-l1">FUEL</span><i><b id="ops-fuel"></b></i></div><div><span id="ops-l2">ARMAMENT</span><i><b id="ops-ammo"></b></i></div></div>
        <button id="btn-takeoff" class="mil-btn big hidden" type="button"><span class="mb-ic">&#9650;</span> TAKEOFF</button></div>
    <button id="btn-autoland" class="mil-btn autoland hidden" type="button"><span class="mb-ic">&#9660;</span> AUTO LAND</button>
    <div class="top-center">
      <div class="top-row">
        <div class="pill score-pill"><small>SCORE</small><b id="hud-score">0</b></div>
        <div class="fuel-dial" id="fuel-dial" title="FUEL"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" class="fd-bez"/><circle cx="50" cy="50" r="40" class="fd-face"/><path d="M 19.4 73 A 40 40 0 1 1 80.6 73" class="fd-arc"/><path d="M 19.4 73 A 40 40 0 0 1 28 30" class="fd-red"/>
<g class="fd-ticks"><line x1="50" y1="14" x2="50" y2="22"/><line x1="26" y1="24" x2="31" y2="30"/><line x1="74" y1="24" x2="69" y2="30"/><line x1="14" y1="50" x2="21" y2="50"/><line x1="86" y1="50" x2="79" y2="50"/></g>
<text x="24" y="86" class="fd-t">EMPTY</text><text x="76" y="86" class="fd-t">FULL</text><text x="50" y="68" class="fd-t fd-lbl">FUEL</text>
<g id="fuel-needle"><line x1="50" y1="50" x2="50" y2="18" class="fd-nd"/></g><circle cx="50" cy="50" r="5" class="fd-hub"/></svg></div>
        <div class="pill time-pill" id="time-pill" style="display:none"><small id="hud-time-label">TIME</small><b id="hud-timer" class="timer">0:00</b></div>
      </div>
      <div class="lvl" id="hud-level"></div>
      <div class="lvl world" id="hud-world"></div>
    </div>
    <div id="hud-track" class="hud-track">TRACK</div>
    <div id="hud-obj" class="objectives"></div>
    <div class="stats" id="stats">
      <div class="statrow hull-row"><span>HULL</span><div class="hull-meter" role="meter" aria-label="Aircraft health" aria-valuemin="0" aria-valuemax="100"><i id="hud-hull"></i></div><b id="hud-hull-value">100%</b></div>
      <div class="statrow"><span>LIFE</span><div class="lives" id="hud-lives"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="statrow heat"><span id="hud-heat-label">GUN</span><div class="bar"><i id="hud-heat"></i></div></div>
      <div class="nums"><span><b id="hud-spd">0</b> km/h</span><span><b id="hud-alt">0</b> m</span><span class="fl-c"><b id="hud-fl">12</b> flares</span><span class="kl-c"><b id="hud-kl">0</b> kills</span></div>
    </div>
    <!-- weapons: bottom left. One consistent ring cooldown on every button. -->
    <div id="weapons" class="weapons">
      <button type="button" class="wbtn w-msl" data-w="missile" aria-label="Missile"><i class="ring"></i>
        <svg viewBox="0 0 24 24"><path d="M3 21 8 16m0 0 8-8c2-2 4-3 5-3 0 1-1 3-3 5l-8 8m-2-2 2 2m-6 2 3-1M7 14l-3 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="16.5" cy="7.5" r="1.4" fill="currentColor"/></svg><em>MISSILE</em><b class="cnt">10/10</b></button>
      <button type="button" class="wbtn w-gun" data-w="gun" aria-label="Guns"><i class="ring"></i>
        <svg viewBox="0 0 24 24"><path d="M5 5v14M10 7v12M15 5v14M20 8v10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg><em>GUN</em><b class="cnt">READY</b></button>
      <button type="button" class="wbtn w-bomb" data-w="bomb" aria-label="Bomb"><i class="ring"></i>
        <svg viewBox="0 0 24 24"><path d="M12 3v5M9 4h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><ellipse cx="12" cy="15" rx="5" ry="6.5" fill="currentColor"/><path d="M10 20.5 8.5 23M14 20.5 15.5 23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><em>BOMB</em><b class="cnt">10/10</b></button>
      <div class="tgt" aria-label="Target select"><button type="button" class="tgt-b" data-w="tgt-up" aria-label="Previous target"><svg viewBox="0 0 24 24"><path d="M5 16l7-8 7 8" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><small>TGT</small><button type="button" class="tgt-b" data-w="tgt-dn" aria-label="Next target"><svg viewBox="0 0 24 24"><path d="M5 8l7 8 7-8" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="thr" id="thr" aria-label="Throttle"><div class="thr-track" id="thr-track"><i class="thr-ticks"></i><i class="thr-fill"></i><b class="thr-knob" id="thr-knob"></b></div><div class="thr-info"><small>THR</small><b id="thr-spd">0</b><small>km/h</small></div></div>
    </div>
    <div id="stick" class="stick"></div>
    <div id="aux" class="aux"><button type="button" class="abtn a-brake" data-w="brake" aria-label="Airbrake"><em>BRAKE</em></button><button type="button" class="abtn a-flare" data-w="flare" aria-label="Flares"><svg class="fe" viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><defs><radialGradient id="fg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd36a"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient></defs><g stroke="#ffb23a" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M24 24 L7 10"/><path d="M24 24 L7 38"/><path d="M24 24 L4 24"/></g><circle cx="24" cy="24" r="9" fill="url(#fg)"/><circle cx="24" cy="24" r="3.2" fill="#fff"/><path d="M33 17 l9 -5 M33 31 l9 5" stroke="#8a929c" stroke-width="2.2" stroke-linecap="round"/></svg><em>FLARES</em></button></div>
    <div id="lvl-title" class="lvl-title"><small>MISSION</small><b></b><em></em></div>
    <button type="button" id="btn-eject" class="hidden" aria-label="Emergency eject">⚠ EJECT <b id="eject-count">5</b></button>
    <div id="alert" class="alert hidden"></div>
    <div id="toasts" class="toasts"></div>
    <div id="low-alt" class="low-alt">PULL UP</div>
    <div id="low-edge" class="low-edge"></div>
    <div id="hit-flash" class="hit-flash"></div>
    <div id="boom-flash" class="boom-flash"></div>
    <div id="fadeblack"></div>
    <div id="crash" class="crash hidden">BOOM!<small>back in the sky...</small></div>
  </div>

  <!-- ===== Loading component (js/loading.js + css/loading.css; restyle there) ===== -->
  <div id="loading" class="loading hidden"></div>

  <!-- ===== Results card: one button, no menus ===== -->
  <section id="results" class="screen results hidden">
    <div class="res-card">
      <div id="res-title" class="res-title"></div>
      <div id="res-stars" class="res-stars"></div>
      <div id="res-sub" class="res-sub"></div>
      <div id="res-list" class="res-list"></div>
      <button type="button" class="metal-btn" id="res-btn"><i class="led"></i><span id="res-btn-label">NEXT</span></button>
    </div>
  </section>

  <section id="hs" class="screen hs hidden" role="dialog" aria-label="High scores">
    <div class="hs-card entry">
      <div class="hs-head">
        <button type="button" class="hs-tab" id="hs-top" aria-label="Jump to top"><i>&#9650;</i><span>TOP</span></button>
        <div class="hs-title"><small>JET-X COMMAND</small>HIGH SCORES</div>
        <button type="button" class="hs-tab" id="hs-home" aria-label="Home"><i>&#8962;</i><span>HOME</span></button>
      </div>
      <div id="hs-new" class="hs-new hidden">
        <div class="hs-sub">MISSION SCORE <b id="hs-score">0</b></div>
        <div class="hs-sub small">CALL SIGN - 5 CHARACTERS</div>
        <div id="hs-entry" class="hs-entry"></div>
        <div class="hs-actions"><button type="button" class="hs-btn" id="hs-clear">CLEAR NAME</button><button type="button" class="hs-btn go" id="hs-ok">OK</button></div>
      </div>
      <div class="hs-wrap" id="hs-wrap"><ol id="hs-list" class="hs-list"></ol></div>
      <button type="button" class="hs-btn go hs-cont hidden" id="hs-btn">CONTINUE</button>
    </div>
  </section>

  <section id="pause" class="screen pause hidden"><div class="res-card"><div class="res-title">Paused</div><button type="button" class="metal-btn" id="pause-btn"><i class="led"></i><span>RESUME</span></button></div></section>

  <section id="resume" class="screen resume hidden" role="dialog" aria-label="Paused">
    <div class="resume-inner">
      <div data-logo3d="logo-img"></div>
      <div class="plates menu-buttons">
        <button type="button" class="plate" id="rs-cont"><i class="led"></i><span class="pt">CONT</span><em class="ps">RESUME SORTIE</em></button>
        <button type="button" class="plate go" id="rs-new"><i class="led"></i><span class="pt">NEW</span><em class="ps">NEW SCENE</em></button>
      </div>
    </div>
  </section>
  <div id="build-tag" class="build-tag"></div>
  <script type="module" src="js/main.js?v=27"></script>
</body>
</html>
